name: Publish Foxs Journey

on:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified standalone portfolio
        run: |
          curl --fail --location --retry 3 --output portfolio.zip 'https://visual-design-archive-33.racing-rose-7690.chatgpt.site/interview-site.zip?version=fox-bounce-20261012'
          echo '317455efd41157cf45b27b60f7d05af7d0372ae11bedb694a00f6a75d2a2153e  portfolio.zip' | sha256sum --check
          mkdir _site
          unzip -q portfolio.zip -d _site
          test -f _site/index.html
          curl --fail --location --retry 3 --output _site/bounce-cards-review.html 'https://raw.githubusercontent.com/foxsx010/FOX/328f2ca802b4483e80bc7635755bf7f6bf534823/reviews/bounce-cards.html'
          touch _site/.nojekyll
      - name: Save portable website for Netlify Drop
        uses: actions/upload-artifact@v4
        with:
          name: Fox-Netlify-Ready
          path: _site/
          retention-days: 30
      - name: Save freelance poster files
        uses: actions/upload-artifact@v4
        with:
          name: Fox-Freelance-Poster
          path: _site/assets/promo/
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

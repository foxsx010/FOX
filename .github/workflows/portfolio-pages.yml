name: Publish Foxs Journey

on:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified standalone portfolio
        run: |
          curl --fail --location --retry 3 --output portfolio.zip 'https://visual-design-archive-33.racing-rose-7690.chatgpt.site/interview-site.zip?version=fox-dot-poster-20261012'
          echo '37b09b0e0f4666bfbca6f3df89cd5f6410309a45a6d95ca545639facfd7dbe97  portfolio.zip' | sha256sum --check
          mkdir _site
          unzip -q portfolio.zip -d _site
          test -f _site/index.html
          touch _site/.nojekyll
      - name: Save portable website for Netlify Drop
        uses: actions/upload-artifact@v4
        with:
          name: Fox-Netlify-Ready
          path: _site/
          retention-days: 30
      - name: Save freelance poster files
        uses: actions/upload-artifact@v4
        with:
          name: Fox-Freelance-Poster
          path: _site/assets/promo/
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

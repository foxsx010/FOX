name: Publish Foxs Journey

on:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified standalone portfolio
        run: |
          curl --fail --location --retry 3 --output portfolio.zip 'https://visual-design-archive-33.racing-rose-7690.chatgpt.site/interview-site.zip?version=image-speed-20261011'
          echo 'fb32fd3513724f4380dc38dc1748c8fefe18f3e300f08fd43962dd2b5a61df19  portfolio.zip' | sha256sum --check
          mkdir _site
          unzip -q portfolio.zip -d _site
          test -f _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
